<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible Box</title>
    <style>
      div.conteiner {
        background-color: lightsalmon;
        display: flex;
        flex-flow: row wrap;
      }
      div.item {
        background-color: lightskyblue;
        border: 1px solid black;
        text-align: center;
        flex-basis: 150px;
        /*
          O flex-basis define o tamanho base do item flexível.
          Se o espaço disponível for maior que o necessário, os itens
          podem crescer para preencher o espaço extra.
          Se o espaço for menor, os itens podem encolher.
          flex-shrink: 1;
          O flex-shrink define se o item pode encolher ou não, o valor 1 significa que o item pode encolher para caber no contêiner. (o valor 1 é padrão)
          flex-grow: 0;
          O flex-grow: define se o item pode crescer ou não, o valor 0 significa que o item não vai crescer além do tamanho base. (o valor 0 é padrão)
        */
      }
    </style>
  </head>
  <body>
    <div class="conteiner">
      <div class="item">A</div>
      <div class="item">Outro conteúdo</div>
      <div class="item">C</div>
      <div class="item">Conteúdo um pouco maior</div>
      <div class="item">E</div>
      <div class="item">Conteúdo maior ainda, que vai ocupar mais espaço.</div>
      <div class="item">G</div>
    </div>
  </body>
</html>
